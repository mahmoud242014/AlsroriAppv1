name: Build Alsrori Messenger iOS & Android

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Align Android Gradle & AGP for Stability
        run: |
          # ضبط إصدارات Gradle و AGP المتوافقة مع فلاتر
          sed -i 's/version "9.1.1"/version "8.5.2"/g' android/settings.gradle.kts
          sed -i 's/version "2.2.20"/version "2.0.20"/g' android/settings.gradle.kts
          sed -i 's/gradle-.*-all.zip/gradle-8.8-all.zip/g' android/gradle/wrapper/gradle-wrapper.properties

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Android APK
        run: flutter build apk --release --no-shrink

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Alsrori-Messenger-APK
          path: build/app/outputs/flutter-apk/app-release.apk

  build-ios:
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Configure iOS Settings & Strip Signing
        run: |
          python3 -c "
          import re
          p = 'ios/Runner.xcodeproj/project.pbxproj'
          with open(p) as f:
              c = f.read()

          # إيقاف Sandboxing لكوكوبودز
          c = c.replace('ENABLE_USER_SCRIPT_SANDBOXING = YES;', 'ENABLE_USER_SCRIPT_SANDBOXING = NO;')
          # إزالة فرق العمل ونمط التوقيع التلقائي
          c = re.sub(r'DEVELOPMENT_TEAM = [^;]+;', 'DEVELOPMENT_TEAM = \"\";', c)
          c = re.sub(r'CODE_SIGN_STYLE = [^;]+;', 'CODE_SIGN_STYLE = Manual;', c)
          c = re.sub(r'\"?CODE_SIGN_IDENTITY[^\"]*\"?\s*=\s*[^;]+;', 'CODE_SIGN_IDENTITY = \"\";', c)
          # إزالة اشتراط ملف Entitlements لتخطي فحص البروفايل في السحابة
          c = re.sub(r'CODE_SIGN_ENTITLEMENTS = [^;]+;', '', c)

          with open(p, 'w') as f:
              f.write(c)
          print('pbxproj successfully sanitized for CI!')
          "

          # تطبيق إعدادات No-Codesign على Flutter Release
          echo 'CODE_SIGNING_ALLOWED=NO' >> ios/Flutter/Release.xcconfig
          echo 'CODE_SIGNING_REQUIRED=NO' >> ios/Flutter/Release.xcconfig
          echo 'CODE_SIGN_IDENTITY=' >> ios/Flutter/Release.xcconfig

      - name: Install Dependencies
        run: flutter pub get

      - name: Pod Install
        run: |
          cd ios
          pod install --repo-update
          cd ..

      - name: Build iOS No-Codesign
        run: |
          flutter build ios --release --no-codesign

      - name: Package Payload to IPA
        run: |
          mkdir -p build/ios/iphoneos/Payload
          cp -r build/ios/iphoneos/Runner.app build/ios/iphoneos/Payload/
          cd build/ios/iphoneos && zip -r9 Alsrori_Messenger.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Alsrori-Messenger-IPA
          path: build/ios/iphoneos/Alsrori_Messenger.ipa
