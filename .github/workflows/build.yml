name: Build Alsrori Messenger iOS & Android

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.3"
          channel: "stable"
          cache: true

      - name: Fix pubspec.yaml Automatically
        run: |
          sed -i 's/sdk: \^3.11.5/sdk: ">=3.2.0 <4.0.0"/g' pubspec.yaml
          sed -i 's/flutter_lints: \^6.0.0/flutter_lints: ^4.0.0/g' pubspec.yaml
          sed -i 's/flutter_html: \^3.0.0/flutter_html: 3.0.0-beta.2/g' pubspec.yaml

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Android APK
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Alsrori-Messenger-APK
          path: build/app/outputs/flutter-apk/app-release.apk

  build-ios:
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.3"
          channel: "stable"
          cache: true

      - name: Fix pubspec.yaml Automatically
        run: |
          sed -i '' 's/sdk: \^3.11.5/sdk: ">=3.2.0 <4.0.0"/g' pubspec.yaml
          sed -i '' 's/flutter_lints: \^6.0.0/flutter_lints: ^4.0.0/g' pubspec.yaml
          sed -i '' 's/flutter_html: \^3.0.0/flutter_html: 3.0.0-beta.2/g' pubspec.yaml

      - name: Configure iOS Settings for CI
        run: |
          sed -i '' 's/ENABLE_USER_SCRIPT_SANDBOXING = YES;/ENABLE_USER_SCRIPT_SANDBOXING = NO;/g' ios/Runner.xcodeproj/project.pbxproj 2>/dev/null || true
          echo 'CODE_SIGNING_ALLOWED=NO' >> ios/Flutter/Release.xcconfig
          echo 'CODE_SIGNING_REQUIRED=NO' >> ios/Flutter/Release.xcconfig
          echo 'CODE_SIGN_IDENTITY=' >> ios/Flutter/Release.xcconfig

      - name: Install Dependencies
        run: flutter pub get

      - name: Pod Install
        run: |
          cd ios
          pod install --repo-update
          cd ..

      - name: Build iOS No-Codesign
        run: |
          flutter build ios --release --no-codesign

      - name: Package Payload to IPA
        run: |
          mkdir -p build/ios/iphoneos/Payload
          cp -r build/ios/iphoneos/Runner.app build/ios/iphoneos/Payload/
          cd build/ios/iphoneos && zip -r9 Alsrori_Messenger.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Alsrori-Messenger-IPA
          path: build/ios/iphoneos/Alsrori_Messenger.ipa
